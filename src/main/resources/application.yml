server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5434/transaction_db
    username: transaction_user
    password: transaction_pass

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc.time_zone: UTC
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://127.0.0.1:5434/transaction_db
    user: transaction_user
    password: transaction_pass

  docker:
    compose:
      enabled: false




